name: Validate custom node
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python source syntax
        run: python -m compileall -q __init__.py api.py native_llm_config.py image_context.py
      - name: Check JavaScript syntax
        run: |
          cp web/native_llm_api.js /tmp/native_llm_api.mjs
          node --check /tmp/native_llm_api.mjs
          cp web/native_llm_chat.js /tmp/native_llm_chat.mjs
          node --check /tmp/native_llm_chat.mjs
          node --check web/native_llm_sse.mjs
      - name: Test chat streaming and conversation behavior
        run: node --test tests/test_chat_sse.mjs
      - name: Install lightweight image API test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp Pillow
      - name: Validate config persistence, vision and API inputs
        run: python -m unittest discover -s tests -v
